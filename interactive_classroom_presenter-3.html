    <script>
        // Web Audio API Synthesizer
        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-btn').innerText = soundEnabled ? '🔊' : '🔇';
        }

        function playSound(type) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'tick') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'beep-high') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1200, now);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                osc.start(now);
                osc.stop(now + 0.45);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(180, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'join') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'reveal') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-2.5 rounded-xl text-xs font-kanit font-bold shadow-xl transition-all transform translate-y-2 opacity-0 flex items-center space-x-2 ${
                type === 'success' ? 'bg-emerald-500 text-white' :
                type === 'error' ? 'bg-rose-500 text-white' : 'bg-electric text-white'
            }`;
            toast.innerHTML = `<span>${type === 'success' ? '✅' : type === 'error' ? '⚠️' : 'ℹ️'}</span><span>${msg}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'tadimee-game-app';
        let firebaseConfig = {
    apiKey: "AIzaSy...", // ของคุณ
    authDomain: "tadimee-game.firebaseapp.com",
    projectId: "tadimee-game",
    storageBucket: "tadimee-game.appspot.com",
    messagingSenderId: "...",
    appId: "1:...:web:..."
};

        // Default Firebase Config Fallback if not injected
        if (!firebaseConfig) {
            firebaseConfig = {
                apiKey: "AIzaSyDummyKeyForFallback",
                authDomain: "tadimee-app.firebaseapp.com",
                projectId: "tadimee-app",
                storageBucket: "tadimee-app.appspot.com",
                messagingSenderId: "123456789",
                appId: "1:123456789:web:abcdef"
            };
        }

        let app, auth, db;
        let currentUser = null;
        let roomUnsubscribe = null;

        // Make modules accessible to global scope
        window.appId = appId;
        window.currentRole = 'host'; // 'host', 'player', 'split'
        window.roomPin = '8492';

        // Local Memory Copy of Room State
        window.roomState = {
            pin: '8492',
            status: 'lobby', // 'lobby', 'memory', 'question', 'explanation', 'final'
            currentRoundIdx: 0,
            currentQuestionIdx: 0,
            memoryTimer: 10,
            questionStartTime: 0,
            players: [
                { id: 'p_demo_1', name: 'สมชาย 🚀', score: 0, lastAnswer: null, answeredAt: 0 },
                { id: 'p_demo_2', name: 'สุดา 🌸', score: 0, lastAnswer: null, answeredAt: 0 }
            ]
        };

        window.myPlayerId = 'p_user_' + Math.floor(1000 + Math.random() * 9000);
        window.myPlayerName = 'นักศึกษา ' + Math.floor(10 + Math.random() * 90);
        window.hostTimerInterval = null;

        // Local Fallback Broadcast Channel for same-browser testing
        const broadcastChannel = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('tadimee_sync_channel') : null;
        if (broadcastChannel) {
            broadcastChannel.onmessage = (event) => {
                if (event.data && event.data.type === 'STATE_UPDATE') {
                    window.roomState = event.data.state;
                    window.renderApp();
                }
            };
        }

        async function initFirebase() {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                window.db = db;
                window.auth = auth;

                // Auth step
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        const cred = await signInWithCustomToken(auth, __initial_auth_token);
                        currentUser = cred.user;
                    } catch (e) {
                        const cred = await signInAnonymously(auth);
                        currentUser = cred.user;
                    }
                } else {
                    const cred = await signInAnonymously(auth);
                    currentUser = cred.user;
                }

                updateConnectionBadge(true, "เชื่อมต่อ Live Sync เรียบร้อย ✅");
                subscribeToRoom(window.roomPin);

            } catch (err) {
                console.warn("Firebase live mode using local sync mode:", err);
                updateConnectionBadge(false, "โหมดจำลองในเครื่อง (Local Sync)");
            }
        }

        function updateConnectionBadge(isOnline, text) {
            const badge = document.getElementById('connection-badge');
            const txt = document.getElementById('connection-status-text');
            if (txt) txt.innerText = text;
            if (badge) {
                if (isOnline) {
                    badge.className = "px-2.5 py-1 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded-xl text-[10px] md:text-xs font-kanit font-bold flex items-center space-x-1";
                } else {
                    badge.className = "px-2.5 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-xl text-[10px] md:text-xs font-kanit font-bold flex items-center space-x-1";
                }
            }
        }

        // Subscribe to real-time room changes in Firestore
        window.subscribeToRoom = function(pin) {
            window.roomPin = pin;
            if (!db || !currentUser) return;

            if (roomUnsubscribe) roomUnsubscribe();

            // Strict Path Rule: /artifacts/{appId}/public/data/gameRooms/{roomPin}
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'gameRooms', pin);

            roomUnsubscribe = onSnapshot(roomRef, (snapshot) => {
                if (snapshot.exists()) {
                    window.roomState = snapshot.data();
                    window.renderApp();
                } else {
                    // Create room if Host and doesn't exist
                    if (window.currentRole === 'host') {
                        window.pushStateToCloud();
                    }
                }
            }, (err) => {
                console.error("Snapshot error:", err);
            });
        };

        // Push state update to cloud & local broadcast channel
        window.pushStateToCloud = async function() {
            window.renderApp();

            if (broadcastChannel) {
                broadcastChannel.postMessage({ type: 'STATE_UPDATE', state: window.roomState });
            }

            if (!db || !currentUser) return;

            try {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'gameRooms', window.roomPin);
                await setDoc(roomRef, window.roomState, { merge: true });
            } catch (err) {
                console.error("Failed to push state to Firestore:", err);
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            initFirebase();
            window.renderApp();
        });
    </script>

        function hostStartMemoryPhase() {
            window.roomState.status = 'memory';
            const roundData = GAME_DATA[window.roomState.currentRoundIdx];
            window.roomState.memoryTimer = roundData.memoryTime;
            window.pushStateToCloud();

            if (window.hostTimerInterval) clearInterval(window.hostTimerInterval);

            window.hostTimerInterval = setInterval(() => {
                window.roomState.memoryTimer--;
                playSound('tick');

                if (window.roomState.memoryTimer <= 0) {
                    clearInterval(window.hostTimerInterval);
                    playSound('beep-high');
                    hostEndMemoryPhase();
                } else {
                    window.pushStateToCloud();
                }
            }, 1000);
        }

        function hostEndMemoryPhase() {
            if (window.hostTimerInterval) clearInterval(window.hostTimerInterval);
            window.roomState.status = 'question';
            window.roomState.questionStartTime = Date.now();
            window.roomState.players.forEach(p => { p.lastAnswer = null; });
            window.pushStateToCloud();
        }

        function hostShowExplanation() {
            window.roomState.status = 'explanation';
            playSound('reveal');
            
            // Trigger Confetti on host screen
            if (typeof confetti === 'function') {
                confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
            }

            window.pushStateToCloud();
        }

        function hostNextQuestion() {
            const roundData = GAME_DATA[window.roomState.currentRoundIdx];
            window.roomState.currentQuestionIdx++;

            if (window.roomState.currentQuestionIdx < roundData.questions.length) {
                window.roomState.status = 'question';
                window.roomState.questionStartTime = Date.now();
                window.roomState.players.forEach(p => { p.lastAnswer = null; });
            } else {
                window.roomState.currentRoundIdx++;
                if (window.roomState.currentRoundIdx < GAME_DATA.length) {
                    window.roomState.currentQuestionIdx = 0;
                    hostStartMemoryPhase();
                    return;
                } else {
                    window.roomState.status = 'final';
                }
            }
            window.pushStateToCloud();
        }

        function hostRestartGame() {
            window.roomState.currentRoundIdx = 0;
            window.roomState.currentQuestionIdx = 0;
            window.roomState.status = 'lobby';
            window.roomState.players.forEach(p => { p.score = 0; p.lastAnswer = null; });
            window.pushStateToCloud();
        }

        function toggleHostGridModal(show) {
            const modal = document.getElementById('host-grid-modal');
            if (!modal) return;
            if (show) {
                const roundData = GAME_DATA[window.roomState.currentRoundIdx];
                if (!roundData || !roundData.grid) return;

                let gridHtml = `<div class="grid gap-2 w-full mx-auto max-w-md" style="grid-template-columns: repeat(${roundData.gridSize.cols}, minmax(0, 1fr));">`;
                for (let r = 0; r < roundData.gridSize.rows; r++) {
                    for (let c = 0; c < roundData.gridSize.cols; c++) {
                        gridHtml += `
                            <div class="bg-navy-950 border border-navy-800 rounded-xl aspect-square flex items-center justify-center text-xl md:text-2xl">
                                ${roundData.grid[r][c]}
                            </div>
                        `;
                    }
                }
                gridHtml += `</div>`;

                document.getElementById('host-modal-grid-content').innerHTML = gridHtml;
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }
    </script>

    <script>
        // Player View UI Logic (Mobile Screen)
        function renderPlayerView() {
            const state = window.roomState;
            const myPlayer = state.players.find(p => p.id === window.myPlayerId);

            if (!myPlayer && (state.status === 'lobby' || state.status === 'memory' || state.status === 'question')) {
                return `
                    <div class="space-y-6 text-center bg-navy-900 border border-navy-800 p-6 rounded-3xl shadow-xl font-kanit">
                        <div class="text-5xl">📱👀</div>
                        <div>
                            <h2 class="text-2xl font-bold text-white">เข้าร่วมเกม "ตาดีมีแต้ม"</h2>
                            <p class="text-xs text-slate-400 mt-1">ใส่รหัส PIN จากจออาจารย์เพื่อเข้าเล่นสด</p>
                        </div>
                        
                        <div class="space-y-3 text-left">
                            <div>
                                <label class="text-xs text-slate-400 font-bold block mb-1">GAME PIN CODE</label>
                                <input id="player-pin-input" type="text" value="${state.pin}" class="w-full bg-navy-950 border border-navy-700 px-4 py-3 rounded-xl font-mono text-center text-2xl text-lime font-bold focus:outline-none focus:border-electric">
                            </div>
                            <div>
                                <label class="text-xs text-slate-400 font-bold block mb-1">ชื่อเล่นของคุณ</label>
                                <input id="player-name-input" type="text" value="${window.myPlayerName}" class="w-full bg-navy-950 border border-navy-700 px-4 py-3 rounded-xl text-center text-white font-bold focus:outline-none focus:border-electric">
                            </div>
                        </div>

                        <button onclick="playerJoinRoom()" class="w-full py-4 bg-lime text-navy-950 font-black text-lg rounded-xl shadow-lg hover:bg-emerald-400 transition">
                            เข้าห้องเรียนเรียลไทม์ ➔
                        </button>
                    </div>
                `;
            }

            if (state.status === 'lobby') {
                return `
                    <div class="text-center space-y-6 bg-navy-900 border border-navy-800 p-8 rounded-3xl font-kanit">
                        <div class="text-6xl animate-bounce">👍</div>
                        <h2 class="text-2xl font-bold text-white">คุณเข้าห้องเรียบร้อย!</h2>
                        <p class="text-sm text-slate-300">ชื่อผู้เล่น: <strong class="text-lime">${myPlayer ? myPlayer.name : ''}</strong></p>
                        <div class="p-4 bg-navy-950 rounded-2xl border border-navy-800 text-xs text-slate-400 leading-relaxed">
                            👀 กรุณามองไปที่ **หน้าจอใหญ่ของอาจารย์**<br>อาจารย์กำลังรอนักศึกษาท่านอื่นเพื่อกดเริ่มเกม
                        </div>
                    </div>
                `;
            }

            if (state.status === 'memory') {
                return `
                    <div class="text-center space-y-6 bg-navy-900 border border-navy-800 p-8 rounded-3xl font-kanit">
                        <div class="text-6xl animate-pulse">👁️</div>
                        <h2 class="text-xl font-bold text-accentYellow">เพ่งสายตามองตารางบนจอใหญ่!</h2>
                        <p class="text-xs text-slate-400">ภาพตารางจะถูกซ่อนเมื่อหมดเวลา</p>
                        <div class="font-mono text-4xl text-lime font-extrabold bg-navy-950 p-4 rounded-2xl border border-navy-800">
                            ${state.memoryTimer}s
                        </div>
                    </div>
                `;
            }

            if (state.status === 'question' || state.status === 'explanation') {
                const roundData = GAME_DATA[state.currentRoundIdx];
                const qData = roundData ? roundData.questions[state.currentQuestionIdx] : null;

                const hasAnswered = (myPlayer && myPlayer.lastAnswer !== null && myPlayer.lastAnswer !== undefined);

                const kahootBtns = [
                    { bg: 'bg-kahootRed', shape: '▲', label: 'A', idx: 0 },
                    { bg: 'bg-kahootBlue', shape: '◆', label: 'B', idx: 1 },
                    { bg: 'bg-kahootYellow', shape: '●', label: 'C', idx: 2 },
                    { bg: 'bg-kahootGreen', shape: '■', label: 'D', idx: 3 }
                ];

                if (hasAnswered && state.status === 'question') {
                    return `
                        <div class="text-center space-y-6 bg-navy-900 border border-navy-800 p-8 rounded-3xl font-kanit">
                            <div class="text-5xl animate-bounce">✅</div>
                            <h2 class="text-2xl font-bold text-lime">ส่งคำตอบเรียบร้อย!</h2>
                            <p class="text-xs text-slate-400">รอนักศึกษาคนอื่นตอบและรออาจารย์กดเฉลยบนจอใหญ่</p>
                            <div class="text-xs text-slate-500 font-mono">ส่งคำตอบตัวเลือก: ${kahootBtns[myPlayer.lastAnswer]?.label}</div>
                        </div>
                    `;
                }

                if (state.status === 'explanation') {
                    const isCorrect = qData && (myPlayer.lastAnswer === qData.correct);

                    return `
                        <div class="text-center space-y-6 bg-navy-900 border border-navy-800 p-8 rounded-3xl font-kanit">
                            <div class="text-6xl">${isCorrect ? '🎉' : '❌'}</div>
                            <h2 class="text-2xl font-black ${isCorrect ? 'text-lime' : 'text-kahootRed'}">
                                ${isCorrect ? 'ตอบถูกต้อง! (+100 pt)' : 'ตอบผิดอย่างน่าเสียดาย'}
                            </h2>
                            <div class="p-4 bg-navy-950 rounded-2xl border border-navy-800 text-xs text-slate-300">
                                เฉลยข้อนี้: <strong class="text-accentYellow">${qData ? qData.options[qData.correct] : ''}</strong>
                            </div>
                            <div class="text-sm text-slate-300">คะแนนสะสมของคุณ: <span class="text-lime font-mono font-extrabold text-lg">${myPlayer ? myPlayer.score : 0} pt</span></div>
                        </div>
                    `;
                }

                return `
                    <div class="space-y-4 font-kanit">
                        <div class="flex justify-between items-center text-xs text-slate-300 bg-navy-900 p-3 rounded-xl border border-navy-800">
                            <span>ผู้เล่น: <strong class="text-white">${myPlayer ? myPlayer.name : ''}</strong></span>
                            <span>คะแนน: <strong class="text-lime font-mono text-sm">${myPlayer ? myPlayer.score : 0} pt</strong></span>
                        </div>

                        <p class="text-xs text-center text-slate-400 font-bold">เลือกคำตอบบนมือถือของคุณ:</p>

                        <div class="grid grid-cols-2 gap-3 h-64">
                            ${kahootBtns.map(b => `
                                <button onclick="playerSubmitAnswer(${b.idx})" class="kahoot-btn ${b.bg} text-white rounded-2xl flex flex-col items-center justify-center p-4 text-3xl font-black transition active:scale-95">
                                    <span>${b.shape}</span>
                                    <span class="text-xs font-bold mt-1">${b.label}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            if (state.status === 'final') {
                return `
                    <div class="text-center space-y-6 bg-navy-900 border border-navy-800 p-8 rounded-3xl font-kanit">
                        <div class="text-6xl">🏆</div>
                        <h2 class="text-2xl font-black text-white">จบการแข่งขัน!</h2>
                        <div class="p-4 bg-navy-950 rounded-2xl border border-navy-800">
                            <span class="text-xs text-slate-400 block mb-1">คะแนนรวมของคุณ</span>
                            <span class="font-mono text-4xl text-lime font-extrabold">${myPlayer ? myPlayer.score : 0} pt</span>
                        </div>
                        <p class="text-xs text-slate-400">ขอบคุณสำหรับการเข้าร่วมสนุกในห้องเรียน!</p>
                    </div>
                `;
            }

            return ``;
        }

        // Player Actions
        function playerJoinRoom() {
            const pinVal = document.getElementById('player-pin-input')?.value.trim();
            const nameVal = document.getElementById('player-name-input')?.value.trim();

            if (!nameVal) {
                showToast('กรุณากรอกชื่อเล่นของคุณ', 'error');
                return;
            }

            if (pinVal && pinVal !== window.roomPin) {
                window.roomPin = pinVal;
                if (window.subscribeToRoom) {
                    window.subscribeToRoom(window.roomPin);
                }
            }

            window.myPlayerName = nameVal;
            const existing = window.roomState.players.find(p => p.id === window.myPlayerId);
            if (!existing) {
                window.roomState.players.push({
                    id: window.myPlayerId,
                    name: window.myPlayerName,
                    score: 0,
                    lastAnswer: null,
                    answeredAt: 0
                });
            } else {
                existing.name = window.myPlayerName;
            }

            playSound('join');
            showToast(`เข้าร่วมห้อง PIN ${window.roomPin} แล้ว!`, 'success');
            window.pushStateToCloud();
        }

        function playerSubmitAnswer(optionIdx) {
            const myPlayer = window.roomState.players.find(p => p.id === window.myPlayerId);
            if (!myPlayer || myPlayer.lastAnswer !== null) return;

            const roundData = GAME_DATA[window.roomState.currentRoundIdx];
            const qData = roundData ? roundData.questions[window.roomState.currentQuestionIdx] : null;

            myPlayer.lastAnswer = optionIdx;
            myPlayer.answeredAt = Date.now();

            if (qData && optionIdx === qData.correct) {
                myPlayer.score += 100;
                playSound('correct');
            } else {
                playSound('wrong');
            }

            showToast('ส่งคำตอบแล้ว!', 'success');
            window.pushStateToCloud();
        }
    </script>
</body>
</html>
