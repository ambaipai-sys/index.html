<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ตาดีมีแต้ม 👀🎯</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800;900&family=Prompt:wght@300;400;600;700&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: { 950:'#060B19',900:'#0B132B',800:'#1C2541',700:'#2A3A5E',600:'#3D527C' },
            electric:'#3A86FF', lime:'#06D6A0', accentYellow:'#FFD166',
            kahootRed:'#E21B3C', kahootBlue:'#1368CE', kahootYellow:'#D89E00', kahootGreen:'#26890C'
          },
          fontFamily: {
            kanit:['Kanit','sans-serif'],
            prompt:['Prompt','sans-serif'],
            mono:['JetBrains Mono','monospace']
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: #060B19;
      color: #F8FAFC;
      user-select: none;
      overflow-x: hidden;
    }
    .kahoot-btn {
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s;
      box-shadow: 0 8px 0 rgba(0,0,0,0.3);
    }
    .kahoot-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,0.3); }
    .grid-cell {
      transition: all 0.25s ease;
      position: relative;
    }
    .grid-cell:hover { transform: scale(1.04); }
    .pulse-glow { animation: pulse-glow-anim 1.8s infinite; }
    @keyframes pulse-glow-anim {
      0% { box-shadow: 0 0 0 0 rgba(58,134,255,0.62); }
      70% { box-shadow: 0 0 0 16px rgba(58,134,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(58,134,255,0); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-navy-950 text-slate-100">
  <header class="bg-navy-900/90 backdrop-blur border-b border-navy-800 px-4 md:px-8 py-3 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="bg-gradient-to-tr from-electric to-blue-600 text-white p-2 rounded-xl font-kanit font-extrabold text-xl shadow-lg">👀🎯</div>
      <div>
        <h1 class="text-lg md:text-2xl font-kanit font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-electric via-lime to-accentYellow">ตาดีมีแต้ม Live</h1>
        <p class="text-[10px] md:text-xs text-slate-400 font-kanit hidden sm:block">Real-time Cross-Device Classroom Game</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <div id="connection-badge" class="px-2.5 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-xl text-[10px] md:text-xs font-kanit font-bold flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
        <span id="connection-status-text">กำลังพร้อมเล่น</span>
      </div>

      <div class="flex items-center gap-1 bg-navy-950 p-1 rounded-2xl border border-navy-800">
        <button id="mode-btn-host" onclick="switchAppRole('host')" class="px-3 py-1.5 rounded-xl font-kanit text-xs md:text-sm font-bold transition flex items-center gap-1 bg-electric text-white shadow">
          <span>🖥️</span><span class="hidden md:inline">จออาจารย์</span>
        </button>
        <button id="mode-btn-player" onclick="switchAppRole('player')" class="px-3 py-1.5 rounded-xl font-kanit text-xs md:text-sm font-bold transition flex items-center gap-1 text-slate-400 hover:text-white">
          <span>📱</span><span class="hidden md:inline">จอนักศึกษา</span>
        </button>
        <button id="mode-btn-split" onclick="switchAppRole('split')" class="px-3 py-1.5 rounded-xl font-kanit text-xs md:text-sm font-bold transition flex items-center gap-1 text-slate-400 hover:text-white">
          <span>🖥️📱</span><span class="hidden sm:inline">จำลองคู่</span>
        </button>
      </div>

      <button id="sound-btn" onclick="toggleSound()" class="p-2 bg-navy-800 hover:bg-navy-700 rounded-xl transition text-slate-300 hover:text-white text-sm" title="เปิด/ปิด เสียง">🔊</button>
      <button onclick="toggleFullScreen()" class="p-2 bg-navy-800 hover:bg-navy-700 rounded-xl transition text-slate-300 hover:text-white text-sm hidden sm:block" title="เต็มจอ">⛶</button>
    </div>
  </header>

  <main id="app-viewport" class="flex-grow flex items-center justify-center p-3 md:p-6"></main>

  <footer class="bg-navy-900/60 border-t border-navy-800/80 py-2.5 px-6 text-center text-xs text-slate-400 font-kanit flex justify-between items-center">
    <span>เล่นได้หลายเครื่องพร้อมกันจริงด้วย Online Room PIN 🎯</span>
    <span class="hidden md:inline">Memory • Live Sync • Probability • Real-Time Classroom</span>
  </footer>

  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    const STORAGE_KEY = 'tadimee_live_room';
    const appState = {
      role: 'host',
      roomId: '',
      playerName: 'นักศึกษา',
      players: [],
      hostView: 'lobby',
      currentRound: 0,
      currentQuestionIndex: 0,
      timer: 10,
      revealed: false,
      selectedAnswer: null,
      roundStarted: false,
      gameFinished: false,
      answersLocked: false,
      lastResult: null,
      question: null,
      roundData: null,
      roomSeed: null
    };

    const GAME_DATA = [
      {
        round: 1,
        name: 'ROUND 1 — 12-QUESTION CHALLENGE 👀',
        gridSize: { rows: 4, cols: 5 },
        memoryTime: 10,
        grid: [
          ['📱','🍎','🔑','🎧','✏️'],
          ['📕','📱','⌚','🍎','🕶️'],
          ['🔑','🎧','⌚','📕','✏️'],
          ['🍎','🔑','📱','🥤','🕶️']
        ],
        questions: [
          { q:'1. แอปเปิล (🍎) ในภาพมีทั้งหมดกี่ลูก?', options:['2 ลูก','3 ลูก','4 ลูก','5 ลูก'], correct:1, explanation:'แอปเปิล (🍎) มีทั้งหมด 3 ลูก อยู่ที่ตำแหน่ง 2, 9 และ 16' },
          { q:'2. สิ่งของที่อยู่ตรงกลางตารางคืออะไร?', options:['Watch (⌚)','Phone (📱)','Key (🔑)','Glasses (🕶️)'], correct:0, explanation:'ตำแหน่งตรงกลางของตาราง คือ นาฬิกา (Watch ⌚)' },
          { q:'3. โทรศัพท์ (📱) ในภาพมีทั้งหมดกี่ชิ้น?', options:['2 ชิ้น','3 ชิ้น','4 ชิ้น','5 ชิ้น'], correct:1, explanation:'โทรศัพท์มี 3 ชิ้น อยู่ที่ตำแหน่ง 1, 7 และ 18' },
          { q:'4. หนังสือ (📕) ในภาพมีทั้งหมดกี่เล่ม?', options:['1 เล่ม','2 เล่ม','3 เล่ม','4 เล่ม'], correct:1, explanation:'หนังสือมี 2 เล่ม อยู่ที่ตำแหน่ง 6 และ 14' },
          { q:'5. สิ่งของชิ้นแรกคืออะไร?', options:['Phone (📱)','Apple (🍎)','Key (🔑)','Pencil (✏️)'], correct:0, explanation:'ชิ้นแรกคือ โทรศัพท์ (📱)' },
          { q:'6. แว่นตา (🕶️) ในภาพมีทั้งหมดกี่อัน?', options:['1 อัน','2 อัน','3 อัน','4 อัน'], correct:1, explanation:'แว่นตา 2 อัน อยู่ที่ 10 และ 20' },
          { q:'7. สิ่งของชิ้นสุดท้ายคืออะไร?', options:['Pencil (✏️)','Key (🔑)','Glasses (🕶️)','Phone (📱)'], correct:2, explanation:'ชิ้นสุดท้ายคือ แว่นตา (🕶️)' },
          { q:'8. ปากกา (✏️) ในภาพมีทั้งหมดกี่ดินสอ?', options:['1 ดินสอ','2 ดินสอ','3 ดินสอ','4 ดินสอ'], correct:1, explanation:'ปากกา 2 ดินสอ อยู่ที่ตำแหน่ง 5 และ 15' },
          { q:'9. เครื่องประดับชิ้นใดมีจำนวน 2 ชิ้น?', options:['Headphone (🎧)','Watch (⌚)','Apple (🍎)','Drink (🥤)'], correct:1, explanation:'นาฬิกา (⌚) มี 2 ชิ้น' },
          { q:'10. กระป๋องน้ำ (🥤) มีจำนวนกี่อัน?', options:['0 อัน','1 อัน','2 อัน','3 อัน'], correct:1, explanation:'มี 1 กระป๋องน้ำ (🥤) ที่ตำแหน่ง 19' },
          { q:'11. สิ่งของที่มี 3 ชิ้นคืออะไร?', options:['Phone (📱)','Headphone (🎧)','Key (🔑)','Book (📕)'], correct:1, explanation:'หูฟัง (🎧) มีมากที่สุด 3 ชิ้น' },
          { q:'12. ตำแหน่งใดมีคีย์ (🔑)?', options:['ตำแหน่ง 3, 11, 17','ตำแหน่ง 2, 10, 15','ตำแหน่ง 4, 12, 20','ตำแหน่ง 1, 7, 18'], correct:0, explanation:'คีย์อยู่ที่ 3, 11 และ 17' }
        ]
      }
    ];

    let soundEnabled = true;
    let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-btn').innerText = soundEnabled ? '🔊' : '🔇';
    }

    function playSound(type) {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      const patterns = {
        tick: { type:'sine', freq:800, gain:0.08, duration:0.05 },
        'beep-high': { type:'triangle', freq:1200, gain:0.2, duration:0.2 },
        correct: { type:'triangle', freq:[523.25,659.25,783.99], gain:0.25, duration:0.45 },
        wrong: { type:'sawtooth', freq:[220,180], gain:0.2, duration:0.3 },
        join: { type:'sine', freq:[400,800], gain:0.15, duration:0.15 },
        reveal: { type:'sine', freq:[300,600], gain:0.2, duration:0.25 }
      };

      const p = patterns[type];
      if (!p) return;
      osc.type = p.type;
      if (Array.isArray(p.freq)) {
        osc.frequency.setValueAtTime(p.freq[0], now);
        for (let i = 1; i < p.freq.length; i++) {
          osc.frequency.setValueAtTime(p.freq[i], now + (i * (p.duration / p.freq.length)));
        }
      } else {
        osc.frequency.setValueAtTime(p.freq, now);
      }
      gain.gain.setValueAtTime(p.gain, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + p.duration);
      osc.start(now);
      osc.stop(now + p.duration);
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen?.();
      }
    }

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `px-4 py-2.5 rounded-xl text-xs font-kanit font-bold shadow-xl transition-all transform translate-y-2 opacity-0 flex items-center gap-2 ${type === 'success' ? 'bg-emerald-500 text-white' : type === 'error' ? 'bg-rose-500 text-white' : 'bg-electric text-white'}`;
      toast.innerHTML = `<span>${type === 'success' ? '✅' : type === 'error' ? '⚠️' : 'ℹ️'}</span><span>${msg}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function randomCode() {
      return Math.floor(100000 + Math.random() * 900000).toString();
    }

    function normalizeRoom(room) {
      if (!room) return null;
      return {
        roomId: room.roomId || '',
        players: Array.isArray(room.players) ? room.players : [],
        hostView: room.hostView || 'lobby',
        currentRound: room.currentRound || 0,
        currentQuestionIndex: room.currentQuestionIndex || 0,
        timer: room.timer || 10,
        revealed: !!room.revealed,
        selectedAnswer: room.selectedAnswer ?? null,
        roundStarted: !!room.roundStarted,
        gameFinished: !!room.gameFinished,
        answersLocked: !!room.answersLocked,
        lastResult: room.lastResult || null,
        question: room.question || null,
        roundData: room.roundData || null,
        roomSeed: room.roomSeed || null
      };
    }

    function saveRoom() {
      if (!appState.roomId) return;
      const payload = normalizeRoom(appState);
      localStorage.setItem(`${STORAGE_KEY}:${appState.roomId}`, JSON.stringify(payload));
      const bluePrint = { roomId: appState.roomId, players: appState.players, round: appState.currentRound, phase: appState.hostView };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(bluePrint));
    }

    function loadRoomById(roomId) {
      const raw = localStorage.getItem(`${STORAGE_KEY}:${roomId}`);
      if (!raw) return null;
      try {
        return normalizeRoom(JSON.parse(raw));
      } catch {
        return null;
      }
    }

    function ensurePlayerList() {
      if (!appState.players.length) {
        appState.players = [{ id:'host', name:'อาจารย์', score:0, answered:false }];
      }
    }

    function setConnectionStatus(text, tone='amber') {
      const el = document.getElementById('connection-status-text');
      if (!el) return;
      el.textContent = text;
      const badge = document.getElementById('connection-badge');
      badge.className = `px-2.5 py-1 rounded-xl text-[10px] md:text-xs font-kanit font-bold flex items-center gap-1 ${
        tone === 'green' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' :
        tone === 'red' ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' :
        'bg-amber-500/20 text-amber-300 border border-amber-500/30'
      }`;
      const dot = badge.querySelector('span');
      if (dot) {
        dot.className = `w-2 h-2 rounded-full ${tone === 'green' ? 'bg-emerald-400' : tone === 'red' ? 'bg-rose-400' : 'bg-amber-400'} animate-pulse`;
      }
    }

    function updateRoleButtons() {
      const roleMap = { host: 'mode-btn-host', player: 'mode-btn-player', split: 'mode-btn-split' };
      Object.entries(roleMap).forEach(([role, id]) => {
        const btn = document.getElementById(id);
        if (!btn) return;
        const active = appState.role === role;
        btn.className = `px-3 py-1.5 rounded-xl font-kanit text-xs md:text-sm font-bold transition flex items-center gap-1 ${active ? 'bg-electric text-white shadow' : 'text-slate-400 hover:text-white'}`;
      });
    }

    function switchAppRole(role) {
      appState.role = role;
      updateRoleButtons();
      renderApp();
      if (role === 'host' && !appState.roomId) {
        setConnectionStatus('กำลังพร้อมสร้างห้อง', 'amber');
      }
      if (role === 'player') {
        setConnectionStatus('พร้อมเข้าร่วมเกม', 'green');
      }
    }

    function chooseRoom() {
      const room = randomCode();
      appState.roomId = room;
      appState.players = [{ id:'host', name:'อาจารย์', score:0, answered:false }];
      appState.hostView = 'ready';
      appState.currentRound = 1;
      appState.currentQuestionIndex = -1;
      appState.selectedAnswer = null;
      appState.answersLocked = false;
      appState.lastResult = null;
      saveRoom();
      renderApp();
      setConnectionStatus(`ห้อง ${room} พร้อมใช้งาน`, 'green');
      showToast(`สร้างห้องแล้ว PIN: ${room}`, 'success');
    }

    function joinRoomByPin() {
      const pin = document.getElementById('player-room-input')?.value?.trim();
      if (!pin) {
        showToast('กรุณากรอก PIN ห้องก่อน', 'error');
        return;
      }
      const roomData = loadRoomById(pin);
      if (!roomData) {
        showToast('PIN นี้ไม่มีห้องที่ใช้งานอยู่', 'error');
        return;
      }
      appState.roomId = pin;
      appState.players = roomData.players || [{ id:'host', name:'อาจารย์', score:0, answered:false }];
      appState.hostView = roomData.hostView || 'ready';
      const playerName = document.getElementById('player-name-input')?.value?.trim() || `นักศึกษา ${appState.players.length + 1}`;
      appState.playerName = playerName;
      const alreadyRegistered = appState.players.some(p => p.name === playerName);
      if (!alreadyRegistered) {
        appState.players.push({ id: `player-${Date.now()}`, name: playerName, score: 0, answered: false });
      }
      saveRoom();
      renderApp();
      setConnectionStatus(`เชื่อมต่อห้อง ${pin}`, 'green');
      showToast(`เข้าร่วมห้อง ${pin} เรียบร้อย`, 'success');
    }

    function startGameHost() {
      const round = GAME_DATA[0];
      const room = loadRoomById(appState.roomId);
      const safePlayers = room?.players?.length ? room.players : appState.players;
      appState.players = safePlayers.map(p => ({ ...p, score: 0, answered: false }));
      appState.currentRound = 1;
      appState.currentQuestionIndex = 0;
      appState.roundData = round;
      appState.lastResult = null;
      appState.answersLocked = false;
      appState.revealed = false;
      appState.gameFinished = false;
      appState.roundStarted = true;
      saveRoom();
      renderApp();
      runMemoryRound(round);
    }

    function runMemoryRound(round) {
      appState.revealed = true;
      appState.timer = round.memoryTime;
      appState.hostView = 'memory';
      const board = document.getElementById('memory-board');
      if (board) {
        renderBoard(board, round.grid, true);
      }
      saveRoom();
      renderApp();

      const countdown = () => {
        const timerEl = document.getElementById('countdown-timer');
        if (!timerEl) return;
        timerEl.textContent = `${appState.timer}s`;
        if (appState.timer <= 0) {
          appState.revealed = false;
          appState.hostView = 'question';
          appState.currentQuestionIndex = 0;
          saveRoom();
          renderApp();
          return;
        }
        appState.timer -= 1;
        saveRoom();
        setTimeout(countdown, 1000);
      };
      setTimeout(countdown, 1000);
    }

    function renderBoard(el, grid, showAll = true) {
      if (!el) return;
      el.innerHTML = '';
      const rows = grid.length;
      const cols = grid[0].length;
      el.className = `grid gap-2 w-full max-w-xl mx-auto`;
      el.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

      grid.flat().forEach((value, index) => {
        const cell = document.createElement('div');
        cell.className = 'grid-cell aspect-square rounded-2xl border border-white/10 flex items-center justify-center text-2xl md:text-3xl font-black bg-slate-800/80 shadow-lg';
        cell.textContent = showAll ? value : '?';
        cell.style.background = showAll ? 'linear-gradient(135deg,#1C2541,#2A3A5E)' : 'linear-gradient(135deg,#0B132B,#1C2541)';
        if (!showAll) cell.classList.add('pulse-glow');
        el.appendChild(cell);
      });
    }

    function answerQuestion(index) {
      const round = GAME_DATA[0];
      const question = round.questions[appState.currentQuestionIndex];
      if (!question || appState.answersLocked) return;

      appState.answersLocked = true;
      const isCorrect = index === question.correct;
      const player = appState.players.find(p => p.name === appState.playerName) || appState.players[0];
      if (isCorrect) {
        player.score = (player.score || 0) + 10;
        showToast('ตอบถูก! +10', 'success');
        playSound('correct');
      } else {
        showToast(`ตอบผิด! คำตอบที่ถูกคือ ${question.options[question.correct]}`, 'error');
        playSound('wrong');
      }
      appState.lastResult = { correct: isCorrect, explanation: question.explanation, answerLabel: question.options[index] };
      saveRoom();
      renderApp();

      setTimeout(() => {
        if (appState.currentQuestionIndex < round.questions.length - 1) {
          appState.currentQuestionIndex += 1;
          appState.answersLocked = false;
          appState.selectedAnswer = null;
          appState.lastResult = null;
          saveRoom();
          renderApp();
        } else {
          appState.gameFinished = true;
          appState.hostView = 'results';
          saveRoom();
          renderApp();
          confetti({ particleCount: 200, spread: 120, origin: { y: 0.6 } });
          setConnectionStatus('เกมจบแล้ว', 'green');
        }
      }, 2000);
    }

    function renderPlayerPlayerView() {
      if (appState.roomId && appState.hostView === 'question') {
        const round = GAME_DATA[0];
        const question = round.questions[appState.currentQuestionIndex];
        if (!question) return '<div class="text-center"><h2 class="font-kanit text-3xl">กำลังคำนวณคะแนน...</h2></div>';

        return `
          <div class="w-full max-w-5xl">
            <div class="flex justify-between items-center mb-4 bg-navy-900/80 border border-navy-700 rounded-2xl p-3">
              <div>
                <p class="text-xs uppercase text-slate-400">Room PIN</p>
                <p class="text-2xl font-kanit font-black text-electric">${appState.roomId}</p>
              </div>
              <div class="text-right">
                <p class="text-xs uppercase text-slate-400">Player</p>
                <p class="text-xl font-kanit font-bold">${appState.playerName}</p>
              </div>
            </div>

            <div class="bg-navy-900/70 border border-navy-700 rounded-3xl p-5 md:p-8 shadow-2xl">
              <div class="flex items-center justify-between mb-5">
                <span class="px-3 py-1 rounded-full bg-electric/20 text-electric font-kanit font-bold text-xs">Question ${appState.currentQuestionIndex + 1}/${round.questions.length}</span>
                <span class="text-xl font-kanit font-black text-accentYellow">${appState.currentQuestionIndex + 1}. ${question.q}</span>
              </div>

              <div class="grid gap-4 md:grid-cols-2">
                ${question.options.map((opt, idx) => `
                  <button data-answer="${idx}" class="kahoot-btn ${appState.answersLocked ? 'cursor-not-allowed' : ''} bg-${['kahootBlue','kahootRed','kahootGreen','kahootYellow'][idx]} text-white rounded-2xl p-4 text-left shadow-lg hover:brightness-110 font-kanit text-lg md:text-xl font-bold border border-white/10" ${appState.answersLocked ? 'disabled' : ''}>
                    ${String.fromCharCode(65 + idx)}. ${opt}
                  </button>
                `).join('')}
              </div>

              ${appState.lastResult ? `
                <div class="mt-6 p-4 rounded-2xl border ${appState.lastResult.correct ? 'border-emerald-500/50 bg-emerald-500/10' : 'border-rose-500/50 bg-rose-500/10'}">
                  <p class="font-kanit text-xl font-bold ${appState.lastResult.correct ? 'text-emerald-300' : 'text-rose-300'}">${appState.lastResult.correct ? '✅ ตอบถูก' : '❌ ตอบผิด'}</p>
                  <p class="mt-2 text-slate-200">${appState.lastResult.explanation}</p>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }

      if (appState.roomId && appState.hostView === 'memory') {
        return `
          <div class="w-full max-w-5xl text-center">
            <p class="text-xs uppercase text-slate-400 font-kanit mb-4">Memorize the board</p>
            <div id="memory-board" class="w-full max-w-xl mx-auto"></div>
            <div class="mt-6 text-4xl font-kanit font-black text-accentYellow">${appState.timer}s</div>
          </div>
        `;
      }

      if (appState.roomId && appState.hostView === 'results') {
        const players = appState.players.slice().sort((a,b)=> (b.score||0) - (a.score||0));
        return `
          <div class="w-full max-w-3xl bg-navy-900/80 border border-navy-700 rounded-3xl p-6">
            <h2 class="font-kanit text-4xl font-black text-center text-electric mb-6">🏆 ผลคะแนนสุดท้าย</h2>
            <div class="space-y-3">
              ${players.map((p, i) => `
                <div class="flex items-center justify-between rounded-2xl p-4 ${i===0 ? 'bg-amber-500/20 border border-amber-500/40' : 'bg-navy-800/80 border border-navy-700'}">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center font-black text-lg ${i===0 ? 'bg-amber-400 text-navy-950' : 'bg-electric text-white'}">${i + 1}</div>
                    <span class="font-kanit text-xl">${p.name}</span>
                  </div>
                  <span class="font-kanit text-2xl font-black text-accentYellow">${p.score || 0} pts</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      return `
        <div class="w-full max-w-lg bg-navy-900/80 border border-navy-700 rounded-3xl p-6 shadow-2xl">
          <h2 class="font-kanit text-3xl md:text-4xl font-black text-center text-electric mb-4">เข้าร่วมเกม</h2>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-kanit text-slate-300 mb-2">ชื่อเล่น</label>
              <input id="player-name-input" value="${appState.playerName}" class="w-full rounded-2xl border border-navy-700 bg-navy-950 px-4 py-3 text-white outline-none focus:border-electric" placeholder="กรอกชื่อของคุณ" />
            </div>
            <div>
              <label class="block text-sm font-kanit text-slate-300 mb-2">PIN ห้อง</label>
              <input id="player-room-input" class="w-full rounded-2xl border border-navy-700 bg-navy-950 px-4 py-3 text-white outline-none focus:border-electric tracking-[0.5em] text-center text-2xl font-mono" placeholder="000000" maxlength="6" />
            </div>
            <button onclick="joinRoomByPin()" class="w-full kahoot-btn bg-gradient-to-r from-electric to-lime text-white rounded-2xl py-3 font-kanit text-lg font-bold">เข้าร่วมห้อง</button>
          </div>
        </div>
      `;
    }

    function renderHostView() {
      const round = GAME_DATA[0];
      if (appState.hostView === 'memory' || appState.hostView === 'question' || appState.hostView === 'results') {
        return `
          <div class="w-full max-w-6xl">
            <div class="flex justify-between items-center mb-4">
              <div>
                <p class="text-xs uppercase text-slate-400">Host Room</p>
                <h2 class="font-kanit text-2xl md:text-3xl font-black text-electric">PIN ${appState.roomId}</h2>
              </div>
              <div class="text-right">
                <p class="text-xs uppercase text-slate-400">Round</p>
                <h3 class="font-kanit text-xl font-bold">${round.name}</h3>
              </div>
            </div>

            ${appState.hostView === 'memory' ? `
              <div class="bg-navy-900/80 border border-navy-700 rounded-3xl p-4 md:p-6">
                <div class="flex justify-between items-center mb-4">
                  <span class="font-kanit text-lg font-bold text-accentYellow">Memory Phase</span>
                  <span id="countdown-timer" class="font-kanit text-4xl font-black text-accentYellow">${appState.timer}s</span>
                </div>
                <div id="memory-board"></div>
              </div>
            ` : ''}

            ${appState.hostView === 'question' ? `
              <div class="bg-navy-900/80 border border-navy-700 rounded-3xl p-4 md:p-6">
                <div class="mb-4">
                  <span class="px-3 py-1 rounded-full bg-electric/20 text-electric font-kanit text-xs">Question ${appState.currentQuestionIndex + 1}/${round.questions.length}</span>
                </div>
                <h3 class="font-kanit text-2xl md:text-3xl font-black mb-5">${round.questions[appState.currentQuestionIndex].q}</h3>
                <div class="grid gap-3 md:grid-cols-2">
                  ${round.questions[appState.currentQuestionIndex].options.map((opt, idx) => `
                    <div class="rounded-2xl border border-white/10 p-4 font-kanit text-lg bg-${['kahootBlue','kahootRed','kahootGreen','kahootYellow'][idx]}/80">${String.fromCharCode(65 + idx)}. ${opt}</div>
                  `).join('')}
                </div>
                ${appState.lastResult ? `
                  <div class="mt-5 p-4 rounded-2xl border border-emerald-500/30 bg-emerald-500/10">
                    <p class="font-kanit text-xl font-bold text-emerald-300">${appState.lastResult.correct ? '✅ ตอบถูก' : '❌ ตอบผิด'}</p>
                    <p class="mt-2 text-slate-200">${appState.lastResult.explanation}</p>
                  </div>
                ` : ''}
              </div>
            ` : ''}

            ${appState.hostView === 'results' ? `
              <div class="bg-navy-900/80 border border-navy-700 rounded-3xl p-5">
                <h3 class="font-kanit text-3xl font-black text-electric text-center mb-6">🏆 Leaderboard</h3>
                <div class="space-y-3">
                  ${appState.players.slice().sort((a,b)=> (b.score||0) - (a.score||0)).map((p, i) => `
                    <div class="flex items-center justify-between rounded-2xl p-4 ${i===0 ? 'bg-amber-500/20 border border-amber-500/40' : 'bg-navy-800/80 border border-navy-700'}">
                      <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center font-black text-lg ${i===0 ? 'bg-amber-400 text-navy-950' : 'bg-electric text-white'}">${i + 1}</div>
                        <span class="font-kanit text-xl">${p.name}</span>
                      </div>
                      <span class="font-kanit text-2xl font-black text-accentYellow">${p.score || 0} pts</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }

      return `
        <div class="w-full max-w-5xl grid gap-6 md:grid-cols-[1.4fr_0.8fr]">
          <div class="bg-navy-900/80 border border-navy-700 rounded-3xl p-5 md:p-7 shadow-2xl">
            <p class="text-xs uppercase text-slate-400 font-kanit mb-2">Room controls</p>
            <h2 class="font-kanit text-3xl md:text-4xl font-black text-electric mb-4">สร้างห้องและเริ่มเกม</h2>
            <p class="text-slate-300 mb-6">เปิดห้องแล้วให้ผู้เล่นเข้าร่วมด้วย PIN เดียวกัน เพื่อทำแบบทดสอบความจำและตอบคำถามแบบเรียลไทม์</p>
            <div class="space-y-4">
              <button onclick="chooseRoom()" class="w-full kahoot-btn bg-gradient-to-r from-electric to-lime text-white rounded-2xl py-4 font-kanit text-xl font-black">สร้างห้อง PIN ใหม่</button>
              <button onclick="startGameHost()" ${appState.roomId ? '' : 'disabled'} class="w-full kahoot-btn ${appState.roomId ? 'bg-gradient-to-r from-kahootYellow to-amber-500' : 'bg-slate-700 opacity-50 cursor-not-allowed'} text-white rounded-2xl py-4 font-kanit text-xl font-black">เริ่มเกมทันที</button>
            </div>
          </div>

          <div class="bg-navy-900/80 border border-navy-700 rounded-3xl p-5 shadow-2xl">
            <p class="text-xs uppercase text-slate-400 font-kanit mb-3">Current room</p>
            <div class="rounded-2xl bg-navy-950 border border-navy-700 p-4 text-center">
              <p class="text-sm text-slate-400">PIN</p>
              <div class="font-mono text-5xl font-black tracking-[0.25em] text-electric mt-2">${appState.roomId || '---'}</div>
            </div>
            <div class="mt-5 space-y-2">
              ${(appState.players || []).map(p => `
                <div class="flex items-center justify-between rounded-xl bg-navy-800/80 px-3 py-2 border border-navy-700">
                  <span class="font-kanit font-bold">${p.name}</span>
                  <span class="text-sm text-amber-300">${p.score || 0} pts</span>
                </div>
              `).join('') || '<p class="text-sm text-slate-400">ยังไม่มีผู้เล่นเข้าร่วม</p>'}
            </div>
          </div>
        </div>
      `;
    }

    function renderSplitView() {
      return `
        <div class="w-full max-w-6xl grid gap-6 lg:grid-cols-2">
          <div class="bg-navy-900/80 border border-navy-700 rounded-3xl p-5 shadow-2xl">
            <h3 class="font-kanit text-2xl font-black text-electric mb-4">จออาจารย์</h3>
            ${renderHostView()}
          </div>
          <div class="bg-navy-900/80 border border-navy-700 rounded-3xl p-5 shadow-2xl">
            <h3 class="font-kanit text-2xl font-black text-electric mb-4">จอนักศึกษา</h3>
            ${renderPlayerPlayerView()}
          </div>
        </div>
      `;
    }

    function renderApp() {
      const viewport = document.getElementById('app-viewport');
      if (!viewport) return;

      if (appState.role === 'host') {
        viewport.innerHTML = renderHostView();
      } else if (appState.role === 'player') {
        viewport.innerHTML = renderPlayerPlayerView();
      } else {
        viewport.innerHTML = renderSplitView();
      }

      const memoryBoard = document.getElementById('memory-board');
      if (memoryBoard && appState.roundData && appState.roundData.grid) {
        renderBoard(memoryBoard, appState.roundData.grid, appState.hostView === 'memory' || appState.revealed);
      }

      const onAnswerButtons = document.querySelectorAll('[data-answer]');
      onAnswerButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-answer'));
          appState.selectedAnswer = idx;
          answerQuestion(idx);
        });
      });

      updateRoleButtons();
      const roomState = loadRoomById(appState.roomId);
      if (roomState && roomState.players) appState.players = roomState.players;
    }

    window.addEventListener('storage', (event) => {
      if (event.key && event.key.startsWith(STORAGE_KEY)) {
        const roomId = event.key.replace(STORAGE_KEY + ':', '');
        if (roomId && roomId === appState.roomId) {
          const saved = loadRoomById(roomId);
          if (saved) {
            Object.assign(appState, saved);
            renderApp();
          }
        }
      }
    });

    renderApp();
    setConnectionStatus('กำลังพร้อมเล่น', 'amber');
  </script>
</body>
</html>
